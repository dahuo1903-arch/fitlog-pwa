<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <title>FitLog · 离线</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        width: 100%;
        max-width: 340px;
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 20px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0 0 20px;
        font-size: 13px;
        line-height: 1.5;
        color: #a1a1aa;
      }
      button {
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 12px;
        background: #10b981;
        color: #09090b;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/apple-touch-icon.png" alt="FitLog" />
      <h1>当前处于离线状态</h1>
      <p>FitLog 需要网络连接来同步饮食、体重与 WHOOP 数据，请检查网络后重试。</p>
      <button type="button" onclick="window.location.reload()">重新加载</button>
    </div>
  </body>
</html>
